services:
  # --- Ingestion backend ---
  migrate:
    build:
      context: ..
      dockerfile: ingestion-workspace/ingestion-backend/Dockerfile
    command: ["sh", "/app/scripts/run-migrate.sh"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: ingestion-workspace/ingestion-backend/Dockerfile
    command: ["sh", "/app/scripts/run-api.sh"]
    ports:
      - "8007:8000"
    env_file:
      - .env
    volumes:
      - ./ingestion-backend/src:/app/src
      - ./ingestion-backend/apps:/app/apps
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      scraper-api:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  worker:
    build:
      context: ..
      dockerfile: ingestion-workspace/ingestion-backend/Dockerfile
    command: ["sh", "/app/scripts/run-worker.sh"]
    env_file:
      - .env
    volumes:
      - ./ingestion-backend/src:/app/src
      - ./ingestion-backend/apps:/app/apps
      - hf-cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      scraper-api:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  pathway-worker:
    build:
      context: ..
      dockerfile: ingestion-workspace/ingestion-backend/Dockerfile
    command: ["sh", "/app/scripts/run-pathway-worker.sh"]
    env_file:
      - .env
    volumes:
      - ./ingestion-backend/src:/app/src
      - ./ingestion-backend/apps:/app/apps
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  # --- Frontend (Vite dev server bound to all interfaces) ---
  frontend:
    build:
      context: ./ingestion-frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./ingestion-frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://host.docker.internal:8007
      - VITE_SCRAPER_URL=http://localhost:8000
      - VITE_RAG_API_URL=http://localhost:8001
    networks:
      - ingestion_backend
    restart: unless-stopped
    depends_on:
      - api

  # --- ngrok tunnel (public URL to frontend) ---
  ngrok:
    image: ngrok/ngrok:alpine
    container_name: ngrok-frontend
    restart: unless-stopped
    command:
      - http
      - host.docker.internal:5173
      - --url
      - ${NGROK_DOMAIN:-https://semiwildly-superadaptable-vernice.ngrok-free.dev}
      - --config
      - /etc/ngrok.yml
      - --log
      - stdout
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ngrok-auth.yml:/etc/ngrok.yml:ro
    ports:
      - "4040:4040"
    networks:
      - ingestion_backend
  # --- Web scrapper ---
  scraper-api:
    image: tharun0511/web-scrapper-wokspace:latest
    command: ["sh", "/app/scripts/run-api.sh"]
    ports:
      - "8000:8000"
    env_file:
      - .env.scraper
    volumes:
      - scraper_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      scraper-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  scraper-worker:
    image: tharun0511/web-scrapper-wokspace:latest
    command: ["sh", "/app/scripts/run-worker.sh"]
    shm_size: "2gb"
    env_file:
      - .env.scraper
    volumes:
      - scraper_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      scraper-api:
        condition: service_started
      scraper-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  scraper-migrate:
    image: tharun0511/web-scrapper-wokspace:latest
    command: ["crawler-db-migrate"]
    env_file:
      - .env.scraper
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --- Shared infrastructure ---
  otel-collector:
    image: otel/opentelemetry-collector:0.148.0
    container_name: otel
    restart: unless-stopped
    ports:
      - 4317:4317
      - 4318:4318
    env_file:
      - ../otel/.env
    volumes:
      - ../otel/otel-collector-config.yaml:/etc/otelcol/config.yaml
    command: ["--config=/etc/otelcol/config.yaml"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: qdrant
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ingestion
      POSTGRES_PASSWORD: ingestion
      POSTGRES_DB: ingestion
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-crawler-db.sql:/docker-entrypoint-initdb.d/02-crawler.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestion -d ingestion"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # --- RAG App services ---
  rag-migrate:
    build:
      context: ..
      dockerfile: rag-app-workspace/Dockerfile
    command: ["sh", "/app/scripts/run-migrate.sh"]
    env_file:
      - .env.rag
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  rag-api:
    build:
      context: ..
      dockerfile: rag-app-workspace/Dockerfile
    command: ["sh", "/app/scripts/run-api.sh"]
    ports:
      - "8001:8001"
    depends_on:
      rag-migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    env_file:
      - .env.rag
    environment:
      OTEL_SERVICE_NAME: rag-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped

  eval-worker:
    build:
      context: ..
      dockerfile: rag-app-workspace/Dockerfile
    command: ["sh", "/app/scripts/run-worker.sh"]
    depends_on:
      rag-migrate:
        condition: service_completed_successfully
      rag-api:
        condition: service_started
      otel-collector:
        condition: service_started
    env_file:
      - .env.rag
    environment:
      OTEL_SERVICE_NAME: eval-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped

networks:
  ingestion_backend:
    driver: bridge

volumes:
  minio_data:
  pg_data:
  qdrant_data:
  scraper_data:
  hf-cache:
