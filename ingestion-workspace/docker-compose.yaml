services:
  # --- Ingestion backend ---
  migrate:
    build:
      context: ..
      dockerfile: ingestion-workspace/ingestion-backend/Dockerfile
    command: ["sh", "/app/scripts/run-migrate.sh"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: ingestion-workspace/ingestion-backend/Dockerfile
    command: ["sh", "/app/scripts/run-api.sh"]
    ports:
      - "8007:8000"
    env_file:
      - .env
    volumes:
      - file_storage:/app/storage
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      scraper-api:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: ingestion-workspace/ingestion-backend/Dockerfile
    command: ["sh", "/app/scripts/run-worker.sh"]
    env_file:
      - .env
    volumes:
      - file_storage:/app/storage
      - hf-cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      scraper-api:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: ./ingestion-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=
      - VITE_SCRAPER_URL=/scraper-api
      - VITE_RAG_API_URL=/rag-api
    depends_on:
      - api

  # --- Web scrapper (pre-built image — no sibling repo required) ---
  scraper-api:
    image: tharun0511/web-scrapper-wokspace:latest
    command: ["sh", "/app/scripts/run-api.sh"]
    ports:
      - "8000:8000"
    env_file:
      - .env.scraper
    volumes:
      - scraper_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      scraper-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  scraper-worker:
    image: tharun0511/web-scrapper-wokspace:latest
    command: ["sh", "/app/scripts/run-worker.sh"]
    shm_size: "2gb"
    env_file:
      - .env.scraper
    volumes:
      - scraper_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      scraper-api:
        condition: service_started
      scraper-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  scraper-migrate:
    image: tharun0511/web-scrapper-wokspace:latest
    command: ["crawler-db-migrate"]
    env_file:
      - .env.scraper
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --- Shared infrastructure ---
  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: qdrant
    restart: unless-stopped
    networks:
      - default
      - rag-shared

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - default
      - rag-shared

  postgres:
    image: custom-postgres-init:latest
    environment:
      POSTGRES_USER: ingestion
      POSTGRES_PASSWORD: ingestion
      POSTGRES_DB: ingestion
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - default
      - rag-shared

  # --- RAG App services ---
  rag-migrate:
    build:
      context: ..
      dockerfile: rag-app-workspace/Dockerfile
    command: ["sh", "/app/scripts/run-migrate.sh"]
    env_file:
      - .env.rag
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  rag-api:
    build:
      context: ..
      dockerfile: rag-app-workspace/Dockerfile
    command: ["sh", "/app/scripts/run-api.sh"]
    ports:
      - "8001:8001"
    depends_on:
      rag-migrate:
        condition: service_completed_successfully
    env_file:
      - .env.rag
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped

  eval-worker:
    build:
      context: ..
      dockerfile: rag-app-workspace/Dockerfile
    command: ["sh", "/app/scripts/run-worker.sh"]
    depends_on:
      rag-migrate:
        condition: service_completed_successfully
      rag-api:
        condition: service_started
    env_file:
      - .env.rag
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped

  proxy:
    build: ./proxy
    ports:
      - "8090:8090"
    depends_on:
      - web
      - api
      - scraper-api
      - rag-api
    restart: unless-stopped

volumes:
  file_storage:
  pg_data:
  qdrant_data:
  scraper_data:
  hf-cache:

networks:
  rag-shared:
    external: true
    name: rag-shared
