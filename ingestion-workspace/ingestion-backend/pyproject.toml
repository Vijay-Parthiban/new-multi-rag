[project]
name = "ingestion-backend"
version = "0.1.0"
description = "Ingestion platform backend — API, worker, file manager"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "pydantic-settings>=2.6.0",
    "filetype>=1.2.0",
    "greenlet>=3.1.0",
    "qdrant-client>=1.12.0",
    "openai>=1.0.0",
    "fastembed>=0.4.0",
    "httpx>=0.28.0",
    "pymupdf>=1.24.0",
    "apscheduler>=3.10.0",
    "platform-common",
]

[tool.uv.sources]
platform-common = { path = "../../shared-libs/platform-common", editable = true }

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "httpx>=0.28.0", "ruff>=0.8.0"]

[project.scripts]
ingestion-db-migrate = "src.shared.db.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"
