[project]
name = "pathway-worker"
version = "0.1.0"
description = "Pathway-based Airbyte connector worker — syncs external sources to MinIO and triggers RAG indexing"
requires-python = ">=3.11"
dependencies = [
    "pathway>=0.16.0",
    "airbyte>=0.21.0",
    "boto3>=1.36.0",
    "aioboto3>=14.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "apscheduler>=3.10.0",
    "platform-common",
]

[tool.uv.sources]
platform-common = { path = "../../shared-libs/platform-common", editable = true }

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"