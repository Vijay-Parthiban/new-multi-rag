[project]
name = "rag-platform"
version = "0.1.0"
description = "RAG platform: retrieve, rerank, generate, evaluate"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["libs/*", "apps/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [
    "libs/shared/src",
    "libs/vector-core/src",
    "libs/retrieval-core/src",
    "libs/reranker-core/src",
    "libs/generation-core/src",
    "libs/rag-core/src",
    "libs/eval-core/src",
    "libs/database/src",
    "apps/rag-api/src",
    "apps/eval-worker/src",
]
