[project]
name = "rag-database"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "rag-shared",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
]

[tool.uv.sources]
rag-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_db"]

[project.scripts]
rag-db-migrate = "rag_db.migrate:main"
