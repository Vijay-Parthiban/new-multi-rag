[project]
name = "generation-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "rag-shared",
    "openai>=1.0",
]

[tool.uv.sources]
rag-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generation_core"]
