[project]
name = "retrieval-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "rag-shared",
    "vector-core",
    "qdrant-client>=1.12",
]

[tool.uv.sources]
rag-shared = { workspace = true }
vector-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_core"]
