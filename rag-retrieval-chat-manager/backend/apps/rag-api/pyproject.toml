[project]
name = "rag-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "rag-shared",
    "rag-core",
    "retrieval-core",
    "reranker-core",
    "generation-core",
    "eval-core",
    "rag-database",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32",
    "redis>=5.0",
    "rq>=2.0",
]

[tool.uv.sources]
rag-shared = { workspace = true }
rag-core = { workspace = true }
retrieval-core = { workspace = true }
reranker-core = { workspace = true }
generation-core = { workspace = true }
eval-core = { workspace = true }
rag-database = { workspace = true }

[project.scripts]
rag-api = "rag_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_api"]
