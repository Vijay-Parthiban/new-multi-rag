[project]
name = "eval-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "rag-shared",
    "rag-core",
    "eval-core",
    "rag-database",
    "redis>=5.0",
    "rq>=2.0",
]

[tool.uv.sources]
rag-shared = { workspace = true }
rag-core = { workspace = true }
eval-core = { workspace = true }
rag-database = { workspace = true }

[project.scripts]
eval-worker = "eval_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_worker"]
