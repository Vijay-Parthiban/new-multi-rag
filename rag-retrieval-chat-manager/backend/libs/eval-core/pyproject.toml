[project]
name = "eval-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "rag-shared",
    "rag-core",
    "retrieval-core",
    "reranker-core",
    "generation-core",
    "pydantic>=2.0",
    "langchain-openai>=0.2",
    "langchain-community>=0.3.0,<0.4",
    "openai>=1.0",
    "ragas>=0.2",
    "datasets>=3.0",
    "scipy>=1.11",
]

[tool.uv.sources]
rag-shared = { workspace = true }
rag-core = { workspace = true }
retrieval-core = { workspace = true }
reranker-core = { workspace = true }
generation-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_core"]
