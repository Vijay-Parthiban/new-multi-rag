[project]
name = "eval-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "rag-shared",
    "rag-core",
    "retrieval-core",
    "reranker-core",
    "generation-core",
    "vector-core",
    "qdrant-client>=1.12",
    "pydantic>=2.0",
    "langchain-openai>=0.2",
    "langchain-community>=0.3.0,<0.4",
    "openai>=1.0",
    "ragas>=0.4",
    "deepeval>=4.3,<5",
    "minio>=7.2",
    "datasets>=3.0",
    "scipy>=1.11",
    "pandas>=2.0",
    "pyarrow>=15",
    "openpyxl>=3.1",
    # The Ragas overlap metrics import these two at call time.
    "sacrebleu>=2.4",
    "rouge-score>=0.1",
]

[tool.uv.sources]
rag-shared = { workspace = true }
rag-core = { workspace = true }
retrieval-core = { workspace = true }
reranker-core = { workspace = true }
generation-core = { workspace = true }
vector-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_core"]
