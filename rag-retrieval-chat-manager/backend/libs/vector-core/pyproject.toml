[project]
name = "vector-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "rag-shared",
    "platform-common",
    "qdrant-client>=1.12",
    "fastembed>=0.8.0",
    "openai>=1.0",
]

[tool.uv.sources]
rag-shared = { workspace = true }
platform-common = { path = "../../../shared-libs/platform-common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vector_core"]
