[project]
name = "rag-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "rag-shared",
    "retrieval-core",
    "reranker-core",
    "generation-core",
]

[tool.uv.sources]
rag-shared = { workspace = true }
retrieval-core = { workspace = true }
reranker-core = { workspace = true }
generation-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]
