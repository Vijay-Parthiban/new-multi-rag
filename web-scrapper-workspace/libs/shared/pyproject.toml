[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crawler-shared"
version = "0.1.0"
description = "Shared config, storage, and Redis utilities"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.60.0",
    "playwright-stealth>=2.0.3",
    "pydantic-settings",
    "redis",
    "rq",
    "platform-common",
]

[tool.uv.sources]
platform-common = { path = "../../../shared-libs/platform-common", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/crawler_shared"]
