[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crawler-db"
version = "0.1.0"
description = "SQLAlchemy models and repositories for crawler jobs"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "alembic",
    "crawler-shared",
]

[tool.uv.sources]
crawler-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/crawler_db"]

[project.scripts]
crawler-db-migrate = "crawler_db.migrate:main"
