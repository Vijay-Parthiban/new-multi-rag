[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-crawler"
version = "0.1.0"
description = "Web crawling logic"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "beautifulsoup4",
    "playwright",
    "crawler-shared",
    "platform-common",
    "playwright-stealth>=2.0.3",
]

[tool.uv.sources]
crawler-shared = { workspace = true }
platform-common = { path = "../../../shared-libs/platform-common", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/web_crawler"]
