[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worker"
version = "0.1.0"
description = "RQ worker for crawl and scrape jobs"
requires-python = ">=3.12"
dependencies = [
    "rq",
    "crawler-db",
    "crawler-shared",
    "web-crawler",
    "web-scrapper",
]

[tool.uv.sources]
crawler-db = { workspace = true }
crawler-shared = { workspace = true }
web-crawler = { workspace = true }
web-scrapper = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[project.scripts]
crawler-worker = "worker.main:main"
