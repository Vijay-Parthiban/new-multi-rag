[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli"
version = "0.1.0"
description = "CLI for web crawler"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "crawler-db",
    "crawler-shared",
]

[tool.uv.sources]
crawler-db = { workspace = true }
crawler-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]

[project.scripts]
crawler = "cli.main:app"
