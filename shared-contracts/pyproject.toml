[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shared-contracts"
version = "0.1.0"
description = "Common Pydantic contracts and schemas shared between rag-ingestion-manager and rag-retrieval-chat-manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["shared_contracts"]
