# The whole ingestion project: application, workers, frontend, and the shared data
# tier that the retrieval project also reads.
#
#     docker compose up -d
#
# Three services sit behind the `extras` profile because nothing needs them today:
# neo4j (no destination uses it), opensearch-dashboards (a UI; the product reads
# the index directly) and nifi (the connector sync reaches Google Drive itself).
# Start them with:
#
#     docker compose --profile extras up -d
services:
  migrate:
    build:
      context: ..
      dockerfile: rag-ingestion-manager/backend/Dockerfile
    command:
      - sh
      - /app/scripts/run-migrate.sh
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  api:
    build:
      context: ..
      dockerfile: rag-ingestion-manager/backend/Dockerfile
    command:
      - sh
      - /app/scripts/run-api.sh
    ports:
      - 8007:8000
    env_file:
      - .env
    volumes:
      - file_storage:/app/storage
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      scraper-api:
        condition: service_started
      minio:
        condition: service_started
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
  worker:
    build:
      context: ..
      dockerfile: rag-ingestion-manager/backend/Dockerfile
    command:
      - sh
      - /app/scripts/run-worker.sh
    env_file:
      - .env
    volumes:
      - file_storage:/app/storage
      - hf-cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      scraper-api:
        condition: service_started
      minio:
        condition: service_started
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped
  pathway-worker:
    build:
      context: ..
      dockerfile: rag-ingestion-manager/backend/Dockerfile
    command:
      - python
      - -m
      - apps.pathway_worker.main
    env_file:
      - .env
    volumes:
      - file_storage:/app/storage
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
  nifi:
    image: apache/nifi:1.24.0
    # No current path needs it: the connector sync reaches Google Drive directly.
    profiles: ["extras"]
    ports:
      - 8443:8443
    environment:
      NIFI_WEB_HTTPS_PORT: 8443
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: minioadmin12345
    volumes:
      - nifi_data:/opt/nifi/nifi-current/data
    depends_on:
      - minio
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 5173:5173
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_URL=http://localhost:8007
      - VITE_SCRAPER_URL=http://localhost:8000
      - VITE_RAG_API_URL=http://localhost:8001
      - VITE_LANGFUSE_TRACES_URL=${VITE_LANGFUSE_TRACES_URL:-https://us.cloud.langfuse.com/project/cmrzqh3h90mwlad0ci107tb7j/traces}
    depends_on:
      - api
  scraper-api:
    image: tharun0511/web-scrapper-wokspace:latest
    command:
      - sh
      - /app/scripts/run-api.sh
    ports:
      - 8000:8000
    env_file:
      - .env.scraper
    volumes:
      - scraper_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      scraper-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
  scraper-worker:
    image: tharun0511/web-scrapper-wokspace:latest
    command:
      - sh
      - /app/scripts/run-worker.sh
    shm_size: 2gb
    env_file:
      - .env.scraper
    volumes:
      - scraper_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      scraper-api:
        condition: service_started
      scraper-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
  scraper-migrate:
    image: tharun0511/web-scrapper-wokspace:latest
    command:
      - crawler-db-migrate
    env_file:
      - .env.scraper
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  otel-collector:
    image: otel/opentelemetry-collector:0.148.0
    container_name: otel
    restart: unless-stopped
    ports:
      - 4317:4317
      - 4318:4318
    env_file:
      - ../otel/.env
    volumes:
      - ../otel/otel-collector-config.yaml:/etc/otelcol/config.yaml
    command:
      - --config=/etc/otelcol/config.yaml
  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - 6333:6333
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: qdrant
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ingestion
      POSTGRES_PASSWORD: ingestion
      POSTGRES_DB: ingestion
    ports:
      - 5432:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-crawler-db.sql:/docker-entrypoint-initdb.d/02-crawler.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ingestion -d ingestion
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  guardrails-service:
    build:
      context: ../guardrails-service
    container_name: guardrails
    restart: unless-stopped
    ports:
      - 18000:8000
    env_file:
      - .env.guardrails
    # The LLM-backed validators reach the LiteLLM proxy on the host.
    extra_hosts:
      - host.docker.internal:host-gateway
  neo4j:
    image: neo4j:5.15.0
    # No destination uses Neo4j. Kept for a future graph destination.
    profiles: ["extras"]
    ports:
      - 7474:7474
      - 7687:7687
    environment:
      NEO4J_AUTH: none
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    ports:
      - 9200:9200
      - 9600:9600
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: Admin123456!
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    # A UI for OpenSearch. The product reads the index directly.
    profiles: ["extras"]
    ports:
      - 5601:5601
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: 'true'
    depends_on:
      - opensearch
    restart: unless-stopped
volumes:
  file_storage: null
  pg_data: null
  qdrant_data: null
  scraper_data: null
  hf-cache: null
  minio_data: null
  nifi_data: null
  neo4j_data: null
  opensearch_data: null

# The retrieval project reads the stores declared here, so both projects join one
# network. It cannot be owned by either project: compose rejects a network that
# carries another project's label. So it is external, and it is created once:
#
#     docker network create rag-shared
networks:
  default:
    external: true
    name: rag-shared
