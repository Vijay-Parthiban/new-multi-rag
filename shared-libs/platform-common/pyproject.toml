[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platform-common"
version = "0.1.0"
description = "Shared auth, types, embeddings, and Qdrant helpers for the RAG full pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "qdrant-client>=1.12.0",
    "openai>=1.0.0",
    "fastembed>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/platform_common"]
