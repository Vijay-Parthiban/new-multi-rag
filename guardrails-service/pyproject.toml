[project]
name = "guardrails-service"
version = "0.1.0"
description = "Guardrails AI validation service for RAG pipeline"
requires-python = ">=3.12"
dependencies = [
    "guardrails-ai>=0.11.0",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "nltk>=3.8",
    # The generated engine config is YAML.
    "pyyaml",

    # The rail engine. It orchestrates every guard: the three validators below run as NeMo
    # actions, and NeMo adds the rails this project has none of (self checks, fact check,
    # jailbreak heuristics, PII masking on the retrieved chunks). 0.22 was a breaking release
    # (the LLMModel protocol, LangChain out of the core dependencies, RailOutcome), so the
    # floor is the version this service is verified against.
    "nemoguardrails>=0.24.1,<1.0",
    # No LangChain provider package is needed: from 0.22 the built-in OpenAI-compatible client
    # serves `engine: openai` with `parameters.base_url`, and only an engine whose API is not
    # OpenAI-compatible needs LangChain plus NEMOGUARDRAILS_LLM_FRAMEWORK=langchain.

    # Real Hub validators, published on public PyPI as guardrails-ai-<name>.
    # The `guardrails hub install` CLI and its private registry are deprecated.
    "guardrails-ai-ban-list",
    "guardrails-ai-detect-pii",
    "guardrails-ai-secrets-present",
    "guardrails-ai-valid-length",
    "guardrails-ai-regex-match",
    "guardrails-ai-valid-json",
    "guardrails-ai-one-line",
    "guardrails-ai-ends-with",
    "guardrails-ai-reading-time",
    "guardrails-ai-exclude-sql-predicates",
    "guardrails-ai-mentions-drugs",
    "guardrails-ai-lowercase",
    "guardrails-ai-uppercase",
]
